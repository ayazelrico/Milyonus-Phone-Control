[project]
name = "mphone-sdk"
version = "0.1.0"
description = "Python client for the mphone gateway."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = ["mphone-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mphone_sdk"]
