[project]
name = "mphone-node"
version = "0.1.0"
description = "Device node daemon: discovers attached phones and connects them to the gateway."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["mphone-core", "mphone-backends", "websockets>=13"]

[project.scripts]
mphone-node = "mphone_node.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mphone_node"]
