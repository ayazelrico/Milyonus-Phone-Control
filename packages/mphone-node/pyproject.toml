[project]
name = "mphone-node"
version = "0.1.0"
description = "Device node daemon: discovers attached phones and connects them to the gateway."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = ["mphone-core", "mphone-backends"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mphone_node"]
