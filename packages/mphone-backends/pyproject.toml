[project]
name = "mphone-backends"
version = "0.1.0"
description = "Device backends: android_adb, ios_mirroring, ios_wda, remote, fake."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["mphone-core", "pyyaml>=6.0", "pillow>=10.4", "defusedxml>=0.7", "httpx>=0.27",
    "pyobjc-framework-Vision>=10.3; sys_platform == 'darwin'",
]

[project.entry-points."mphone.backends"]
fake = "mphone_backends.fake:from_uri"
android = "mphone_backends.android_adb.backend:from_uri"
gw = "mphone_backends.remote:from_uri"

[project.entry-points."mphone.ocr"]
vision = "mphone_backends.ocr.vision:VisionEngine"
rapidocr = "mphone_backends.ocr.rapid:RapidEngine"

[project.optional-dependencies]
rapidocr = ["rapidocr-onnxruntime>=1.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mphone_backends"]
