[project]
name = "mphone-backends"
version = "0.1.0"
description = "Device backends: android_adb, ios_mirroring, ios_wda, remote, fake."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = ["mphone-core", "pyyaml>=6.0", "pillow>=10.4"]

[project.entry-points."mphone.backends"]
fake = "mphone_backends.fake:from_uri"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mphone_backends"]
