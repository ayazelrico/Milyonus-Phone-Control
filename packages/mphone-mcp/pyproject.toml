[project]
name = "mphone-mcp"
version = "0.1.0"
description = "MCP server exposing phone control tools (stdio and HTTP)."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["mphone-core", "mphone-backends", "mphone-cli", "mcp>=1.9"]

[project.scripts]
mphone-mcp = "mphone_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mphone_mcp"]

# SKILL.md ships inside the package so an installed server can serve mphone://skill.
[tool.hatch.build.targets.wheel.force-include]
"../../skills/phone-control/SKILL.md" = "mphone_mcp/SKILL.md"
