[project]
name = "mphone-mcp"
version = "0.1.0"
description = "MCP server exposing phone control tools (stdio and HTTP)."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["mphone-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mphone_mcp"]
