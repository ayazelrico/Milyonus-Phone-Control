[project]
name = "mphone-runner"
version = "0.1.0"
description = "Sandboxed runner for remote agent scripts."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = ["mphone-core", "mphone-backends"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mphone_runner"]
