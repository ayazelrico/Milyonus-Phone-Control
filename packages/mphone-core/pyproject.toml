[project]
name = "mphone-core"
version = "0.1.0"
description = "Backend base class, connect(), helpers, Turkish text normalisation, OCR interface, config."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["mphone-protocol"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mphone_core"]
