[project]
name = "mphone-cli"
version = "0.1.0"
description = "The mphone command line."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["mphone-core", "mphone-backends"]

[project.scripts]
mphone = "mphone_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mphone_cli"]
