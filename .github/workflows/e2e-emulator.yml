# The real AndroidAdb backend against Android emulators (A2.15, Phases.md P2 exit criteria).
name: e2e-emulator

on:
  pull_request:
    paths: ["packages/**", "apps/android-ime/**", "tests/e2e_emulator/**", ".github/workflows/e2e-emulator.yml"]
  push:
    branches: ["p2/**"]
    paths: ["packages/**", "apps/android-ime/**", "tests/e2e_emulator/**", ".github/workflows/e2e-emulator.yml"]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: gradle -p apps/android-ime --no-daemon assembleDebug
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: E2E on emulator (API ${{ matrix.api }})
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MPHONE_IME_APK: apps/android-ime/app/build/outputs/apk/debug/app-debug.apk
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: uv run pytest tests/e2e_emulator -v -rA --junitxml=e2e-api${{ matrix.api }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-api${{ matrix.api }}
          path: e2e-api${{ matrix.api }}.xml
