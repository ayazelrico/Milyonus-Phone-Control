# Build the mphone IME (apps/android-ime) and publish the APK as an artifact (A2.09).
name: android-ime

on:
  pull_request:
    paths: ["apps/android-ime/**", ".github/workflows/android-ime.yml"]
  push:
    branches: [main, "p2/**"]
    paths: ["apps/android-ime/**", ".github/workflows/android-ime.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: gradle -p apps/android-ime --no-daemon assembleDebug
      - run: sha256sum apps/android-ime/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mphone-ime-debug-apk
          path: apps/android-ime/app/build/outputs/apk/debug/app-debug.apk
